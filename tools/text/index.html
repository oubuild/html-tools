      * {

      }
      .cat-intro {
        max-width: 640px;

        color: var(--text-secondary);
        line-height: 1.7;
      }
      .cat-meta {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .cat-table {
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--bg-card);
        contain: layout style;
      }
      .cat-table-header {
        display: grid;
        grid-template-columns: minmax(220px, 1.2fr) minmax(260px, 2.2fr);
        align-items: center;
        padding: 0 16px;
        height: 44px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        user-select: none;
      }
      .cat-viewport {
        max-height: 62vh;
        overflow-y: auto;
        overflow-x: hidden;
        position: relative;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .cat-spacer {
        position: relative;
        width: 100%;
      }
      .cat-row {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: var(--row-height, 52px);
        display: grid;
        grid-template-columns: minmax(220px, 1.2fr) minmax(260px, 2.2fr);
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--bg-card);
        transition: background 0.15s ease;
        will-change: transform;
      }
      .cat-row:hover {
        background: var(--bg-card-hover);
      }
      .cat-col {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        overflow: hidden;
      }
      .cat-col-desc {
        font-size: 0.85rem;
        color: var(--text-secondary);
        white-space: nowrap;
        text-overflow: ellipsis;
        user-select: text;
      }
      .cat-row-link {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        text-decoration: none;
        color: inherit;
      }
      .cat-row-link .cat-icon-sm {
        width: 30px;
        height: 30px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        flex-shrink: 0;
        transition: all 0.3s ease;
      }
      .cat-row-link:hover .cat-icon-sm {
        background: var(--accent-cyan);
        border-color: var(--accent-cyan);
      }
      .cat-row-name {
        font-family: var(--font-mono);
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cat-row-link:hover .cat-row-name {
        color: var(--accent-cyan);
      }
      .cat-faq {
        margin-top: var(--space-10);
      }
      .cat-faq h2 {
        font-size: 1.1rem;
        margin-bottom: var(--space-3);
      }
      .cat-footer {
        margin-top: var(--space-8);
        text-align: center;
      }
      .cat-footer a {
        font-size: 0.9rem;
        color: var(--accent-cyan);
        text-decoration: none;
      }
      .cat-footer a:hover {

      }
      @media (width <= 640px) {
        .cat-main {
          padding-left: var(--space-3);
          padding-right: var(--space-3);
        }
        .cat-table-header,
        .cat-row {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);

        }
        .cat-viewport {
          height: 56vh;
          min-height: 260px;
        }
        .cat-row-name {

        }
        .cat-col-desc {

          name: "文本可读性分析器",
          desc: "计算英文文本的 Flesch-Kincaid、Gunning Fog、SMOG 等可读性指数，指出平均句长、音节数和阅读年级。",

        },
      ];
      const ROW_HEIGHT = 52;
      const vp = document.getElementById("cat-viewport");
      const spacer = document.getElementById("cat-spacer");
      const rowCache = new Map();

      const virtualizer = new VirtualCore.Virtualizer({
        count: CAT_TOOLS.length,
        getScrollElement: () => vp,
        estimateSize: () => ROW_HEIGHT,
        overscan: 8,
        observeElementRect: VirtualCore.observeElementRect,
        observeElementOffset: VirtualCore.observeElementOffset,
        scrollToFn: VirtualCore.elementScroll,
        getItemKey: (index) => index,
        onChange: () => renderRows(),
      });

      function createRow(tool) {
        const row = document.createElement("div");
        row.className = "cat-row";
        const link = document.createElement("a");
        link.className = "cat-row-link";
        link.href = tool.href;
        const icon = document.createElement("span");
        icon.className = "cat-icon-sm";
        icon.textContent = tool.icon;
        const name = document.createElement("span");
        name.className = "cat-row-name";
        name.textContent = tool.name;
        link.appendChild(icon);
        link.appendChild(name);
        const desc = document.createElement("span");
        desc.className = "cat-col cat-col-desc";
        desc.textContent = tool.desc;
        desc.title = tool.desc;
        row.appendChild(link);
        row.appendChild(desc);
        return row;
      }

      function renderRows() {
        const items = virtualizer.getVirtualItems();
        spacer.style.height = virtualizer.getTotalSize() + "px";
        const liveKeys = new Set(items.map((i) => i.key));
        for (const [key, row] of rowCache) {
          if (!liveKeys.has(key)) {
            row.remove();
            rowCache.delete(key);
          }
        }
        for (const item of items) {
          let row = rowCache.get(item.key);
          if (!row) {
            row = createRow(CAT_TOOLS[item.index]);
            rowCache.set(item.key, row);
          }
          if (!row.isConnected) {
            spacer.appendChild(row);
          }
          row.style.transform = "translateY(" + item.start + "px)";
        }
      }

      virtualizer._willUpdate();
      virtualizer.measure();
