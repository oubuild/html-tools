    <script src="../../assets/js/virtual-core.js"></script>
    <script>
      // 分类工具数据（由 sync 脚本生成）
      const CAT_TOOLS = [
        {
          href: "privacy-policy.html",
          icon: "🔐",
          name: "隐私政策生成器",
          desc: "快速生成符合法规要求的隐私政策文档",
        },
        {
          href: "terms-generator.html",
          icon: "📜",
          name: "服务条款生成器",
          desc: "快速生成网站或应用的服务条款文档",
        },
        {
          href: "nda-generator.html",
          icon: "🤐",
          name: "保密协议生成器",
          desc: "生成保密协议/NDA文档",
        },
        {
          href: "disclaimer-gen.html",
          icon: "⚠️",
          name: "免责声明生成器",
          desc: "生成各类免责声明文档",
        },
        {
          href: "cookie-policy.html",
          icon: "🍪",
          name: "Cookie政策生成器",
          desc: "生成符合法规的Cookie政策",
        },
        {
          href: "gdpr-checklist.html",
          icon: "✅",
          name: "GDPR合规检查清单",
          desc: "检查GDPR合规性的清单工具",
        },
        {
          href: "contract-review.html",
          icon: "🔍",
          name: "合同条款检查器",
          desc: "检查合同中的常见风险条款",
        },
        {
          href: "legal-deadline.html",
          icon: "⏰",
          name: "法律时限计算器",
          desc: "计算各类法律时限和期限",
        },
        {
          href: "lawyer-fee.html",
          icon: "💰",
          name: "律师费用计算器",
          desc: "估算律师费用和诉讼成本",
        },
        {
          href: "legal-glossary.html",
          icon: "📖",
          name: "法律术语词典",
          desc: "查询常用法律术语的含义",
        },
        {
          href: "agreement-compare.html",
          icon: "⚖️",
          name: "协议对比工具",
          desc: "对比两份协议或合同的差异",
        },
        {
          href: "signature-date.html",
          icon: "📅",
          name: "签署日期格式化器",
          desc: "将日期转换为法律文书常用格式",
        },
        {
          href: "lawsuit-fee.html",
          icon: "🔧",
          name: "诉讼费计算器",
          desc: "计算民事诉讼受理费用",
        },
      ];
      const ROW_HEIGHT = 52;
      const vp = document.getElementById("cat-viewport");
      const spacer = document.getElementById("cat-spacer");
      const rowCache = new Map();

      const virtualizer = new VirtualCore.Virtualizer({
        count: CAT_TOOLS.length,
        getScrollElement: () => vp,
        estimateSize: () => ROW_HEIGHT,
        overscan: 8,
        observeElementRect: VirtualCore.observeElementRect,
        observeElementOffset: VirtualCore.observeElementOffset,
        scrollToFn: VirtualCore.elementScroll,
        getItemKey: (index) => index,
        onChange: () => renderRows(),
      });

      function createRow(tool) {
        const row = document.createElement("div");
        row.className = "cat-row";
        const link = document.createElement("a");
        link.className = "cat-row-link";
        link.href = tool.href;
        const icon = document.createElement("span");
        icon.className = "cat-icon-sm";
        icon.textContent = tool.icon;
        const name = document.createElement("span");
        name.className = "cat-row-name";
        name.textContent = tool.name;
        link.appendChild(icon);
        link.appendChild(name);
        const desc = document.createElement("span");
        desc.className = "cat-col cat-col-desc";
        desc.textContent = tool.desc;
        desc.title = tool.desc;
        row.appendChild(link);
        row.appendChild(desc);
        return row;
      }

      function renderRows() {
        const items = virtualizer.getVirtualItems();
        spacer.style.height = virtualizer.getTotalSize() + "px";
        const liveKeys = new Set(items.map((i) => i.key));
        for (const [key, row] of rowCache) {
          if (!liveKeys.has(key)) {
            row.remove();
            rowCache.delete(key);
          }
        }
        for (const item of items) {
          let row = rowCache.get(item.key);
          if (!row) {
            row = createRow(CAT_TOOLS[item.index]);
            rowCache.set(item.key, row);
          }
          if (!row.isConnected) {
            spacer.appendChild(row);
          }
          row.style.transform = "translateY(" + item.start + "px)";
        }
      }

      virtualizer._willUpdate();
      virtualizer.measure();
    </script>
