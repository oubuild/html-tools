        overflow-x: hidden;
        position: relative;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;

      .cat-spacer {

      .cat-row {
        position: absolute;

        text-overflow: ellipsis;
        user-select: text;
      }
      .cat-row-link {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        text-decoration: none;
        color: inherit;
      }
      .cat-row-link .cat-icon-sm {
        width: 30px;

        border: 1px solid var(--border-subtle);

    <script src="../../assets/js/virtual-core.js"></script>
    <script>
      // 分类工具数据（由 sync 脚本生成）
      const CAT_TOOLS = [
        {
          href: "idcard-generator.html",
          icon: "🆔",
          name: "身份证号码生成器",
          desc: "生成测试用身份证号码",
        },
        {
          href: "idcard-validator.html",
          icon: "✅",
          name: "身份证号码验证器",
          desc: "验证和解析身份证号码",
        },
        {
          href: "uscc-validator.html",
          icon: "🏢",
          name: "统一社会信用代码验证器",
          desc: "验证企业统一社会信用代码",
        },
        {
          href: "license-plate.html",
          icon: "🚗",
          name: "车牌号归属地查询",
          desc: "查询车牌号归属地",
        },
        {
          href: "lunar-calendar.html",
          icon: "📅",
          name: "农历阳历转换",
          desc: "农历阳历日期互转",
        },
        {
          href: "chinese-zodiac.html",
          icon: "🐲",
          name: "生肖查询工具",
          desc: "根据年份查询生肖",
        },
        {
          href: "bank-card-bin.html",
          icon: "💳",
          name: "银行卡BIN查询",
          desc: "查询银行卡发卡行信息",
        },
        {
          href: "phone-attribution.html",
          icon: "📱",
          name: "手机号归属地查询",
          desc: "查询手机号归属地",
        },
        {
          href: "chinese-number.html",
          icon: "壹",
          name: "中文大写数字转换",
          desc: "数字转中文大写金额",
        },
        {
          href: "idiom-dictionary.html",
          icon: "📖",
          name: "成语词典",
          desc: "查询成语释义和用法",
        },
        {
          href: "ancient-poetry.html",
          icon: "📜",
          name: "古诗词查询",
          desc: "古典诗词查询",
        },
        {
          href: "stroke-order.html",
          icon: "✍️",
          name: "汉字笔画顺序",
          desc: "查询汉字笔画顺序",
        },
        {
          href: "pinyin-tone.html",
          icon: "pīn",
          name: "拼音声调标注",
          desc: "为汉字添加拼音注音",
        },
        {
          href: "radicals.html",
          icon: "⺀",
          name: "汉字偏旁部首查询",
          desc: "查询汉字偏旁部首",
        },
        {
          href: "couplet-generator.html",
          icon: "🧧",
          name: "对联生成器",
          desc: "生成传统对联",
        },
      ];
      const ROW_HEIGHT = 52;
      const vp = document.getElementById("cat-viewport");
      const spacer = document.getElementById("cat-spacer");
      const rowCache = new Map();

      const virtualizer = new VirtualCore.Virtualizer({
        count: CAT_TOOLS.length,
        getScrollElement: () => vp,
        estimateSize: () => ROW_HEIGHT,
        overscan: 8,
        observeElementRect: VirtualCore.observeElementRect,
        observeElementOffset: VirtualCore.observeElementOffset,
        scrollToFn: VirtualCore.elementScroll,
        getItemKey: (index) => index,
        onChange: () => renderRows(),
      });

      function createRow(tool) {
        const row = document.createElement("div");
        row.className = "cat-row";
        const link = document.createElement("a");
        link.className = "cat-row-link";
        link.href = tool.href;
        const icon = document.createElement("span");
        icon.className = "cat-icon-sm";
        icon.textContent = tool.icon;
        const name = document.createElement("span");
        name.className = "cat-row-name";
        name.textContent = tool.name;
        link.appendChild(icon);
        link.appendChild(name);
        const desc = document.createElement("span");
        desc.className = "cat-col cat-col-desc";
        desc.textContent = tool.desc;
        desc.title = tool.desc;
        row.appendChild(link);
        row.appendChild(desc);
        return row;
      }

      function renderRows() {
        const items = virtualizer.getVirtualItems();
        spacer.style.height = virtualizer.getTotalSize() + "px";
        const liveKeys = new Set(items.map((i) => i.key));
        for (const [key, row] of rowCache) {
          if (!liveKeys.has(key)) {
            row.remove();
            rowCache.delete(key);
          }
        }
        for (const item of items) {
          let row = rowCache.get(item.key);
          if (!row) {
            row = createRow(CAT_TOOLS[item.index]);
            rowCache.set(item.key, row);
          }
          if (!row.isConnected) {
            spacer.appendChild(row);
          }
          row.style.transform = "translateY(" + item.start + "px)";
        }
      }

      virtualizer._willUpdate();
      virtualizer.measure();
    </script>
