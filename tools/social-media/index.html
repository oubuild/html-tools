      * {

      }

      .cat-meta {
        margin: 0;

        font-size: 0.8rem;

      }
      .cat-table {
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--bg-card);
        contain: layout style;
      }
      .cat-table-header {
        display: grid;
        grid-template-columns: minmax(220px, 1.2fr) minmax(260px, 2.2fr);
        align-items: center;
        padding: 0 16px;
        height: 44px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        user-select: none;
      }
      .cat-viewport {
        max-height: 62vh;
        overflow-y: auto;
        overflow-x: hidden;
        position: relative;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .cat-spacer {
        position: relative;
        width: 100%;
      }
      .cat-row {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: var(--row-height, 52px);
        display: grid;
        grid-template-columns: minmax(220px, 1.2fr) minmax(260px, 2.2fr);
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--bg-card);
        transition: background 0.15s ease;
        will-change: transform;
      }
      .cat-row:hover {
        background: var(--bg-card-hover);
      }
      .cat-col {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        overflow: hidden;
      }
      .cat-col-desc {
        font-size: 0.85rem;
        color: var(--text-secondary);
        white-space: nowrap;
        text-overflow: ellipsis;
        user-select: text;
      }
      .cat-row-link {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        text-decoration: none;
        color: inherit;
      }
      .cat-row-link .cat-icon-sm {
        width: 30px;
        height: 30px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        flex-shrink: 0;
        transition: all 0.3s ease;
      }
      .cat-row-link:hover .cat-icon-sm {
        background: var(--accent-cyan);

    <script src="../../assets/js/virtual-core.js"></script>
    <script>
      // 分类工具数据（由 sync 脚本生成）
      const CAT_TOOLS = [
        {
          href: "hashtag-generator.html",
          icon: "#️⃣",
          name: "热门话题标签生成器",
          desc: "根据关键词生成社交媒体热门话题标签",
        },
        {
          href: "post-scheduler.html",
          icon: "⏰",
          name: "发布时间建议器",
          desc: "推荐各平台最佳发布时间",
        },
        {
          href: "caption-writer.html",
          icon: "✍️",
          name: "社交媒体文案生成器",
          desc: "生成吸引人的社交媒体文案",
        },
        {
          href: "thread-splitter.html",
          icon: "✂️",
          name: "长文分割器",
          desc: "将长文智能分割为社交媒体线程",
        },
        {
          href: "bio-generator.html",
          icon: "👤",
          name: "个人简介生成器",
          desc: "生成个性化的社交媒体个人简介",
        },
        {
          href: "social-preview.html",
          icon: "🔗",
          name: "社交分享预览器",
          desc: "预览链接在各平台的分享效果",
        },
        {
          href: "username-checker.html",
          icon: "🔍",
          name: "用户名可用性检查",
          desc: "检查用户名在各平台的可用性",
        },
        {
          href: "engagement-calc.html",
          icon: "💬",
          name: "互动率计算器",
          desc: "计算社交媒体帖子的互动率",
        },
        {
          href: "follower-growth.html",
          icon: "📈",
          name: "粉丝增长预测器",
          desc: "预测粉丝增长趋势",
        },
        {
          href: "post-length.html",
          icon: "📏",
          name: "帖子长度检查器",
          desc: "检查帖子是否符合各平台字数限制",
        },
        {
          href: "emoji-picker.html",
          icon: "😀",
          name: "Emoji选择器",
          desc: "快速搜索和复制Emoji表情",
        },
        {
          href: "social-color.html",
          icon: "🎨",
          name: "社交平台品牌色",
          desc: "查询各社交平台的官方品牌色",
        },
        {
          href: "og-image-generator.html",
          icon: "🖼️",
          name: "社交媒体 OG 图生成器",
          desc: "选择模板、填写标题和描述，预览并下载符合各平台（Twitter Card、Facebook OG、LinkedIn）尺寸的分享预览图。",
        },
      ];
      const ROW_HEIGHT = 52;
      const vp = document.getElementById("cat-viewport");
      const spacer = document.getElementById("cat-spacer");
      const rowCache = new Map();

      const virtualizer = new VirtualCore.Virtualizer({
        count: CAT_TOOLS.length,
        getScrollElement: () => vp,
        estimateSize: () => ROW_HEIGHT,
        overscan: 8,
        observeElementRect: VirtualCore.observeElementRect,
        observeElementOffset: VirtualCore.observeElementOffset,
        scrollToFn: VirtualCore.elementScroll,
        getItemKey: (index) => index,
        onChange: () => renderRows(),
      });

      function createRow(tool) {
        const row = document.createElement("div");
        row.className = "cat-row";
        const link = document.createElement("a");
        link.className = "cat-row-link";
        link.href = tool.href;
        const icon = document.createElement("span");
        icon.className = "cat-icon-sm";
        icon.textContent = tool.icon;
        const name = document.createElement("span");
        name.className = "cat-row-name";
        name.textContent = tool.name;
        link.appendChild(icon);
        link.appendChild(name);
        const desc = document.createElement("span");
        desc.className = "cat-col cat-col-desc";
        desc.textContent = tool.desc;
        desc.title = tool.desc;
        row.appendChild(link);
        row.appendChild(desc);
        return row;
      }

      function renderRows() {
        const items = virtualizer.getVirtualItems();
        spacer.style.height = virtualizer.getTotalSize() + "px";
        const liveKeys = new Set(items.map((i) => i.key));
        for (const [key, row] of rowCache) {
          if (!liveKeys.has(key)) {
            row.remove();
            rowCache.delete(key);
          }
        }
        for (const item of items) {
          let row = rowCache.get(item.key);
          if (!row) {
            row = createRow(CAT_TOOLS[item.index]);
            rowCache.set(item.key, row);
          }
          if (!row.isConnected) {
            spacer.appendChild(row);
          }
          row.style.transform = "translateY(" + item.start + "px)";
        }
      }

      virtualizer._willUpdate();
      virtualizer.measure();
    </script>
