    <script src="../../assets/js/virtual-core.js"></script>
    <script>
      // 分类工具数据（由 sync 脚本生成）
      const CAT_TOOLS = [
        {
          href: "chinese-calendar.html",
          icon: "📅",
          name: "农历日历",
          desc: "农历日历，在线使用，时间工具，浏览器本地运行无需上传",
        },
        {
          href: "countdown-event.html",
          icon: "📅",
          name: "纪念日倒计时",
          desc: "管理重要日期和纪念日，支持每年重复提醒",
        },
        {
          href: "countdown.html",
          icon: "⏳",
          name: "倒计时器",
          desc: "设定倒计时或目标日期倒数，支持通知提醒",
        },
        {
          href: "cron-parser.html",
          icon: "⚙",
          name: "Cron 表达式解析",
          desc: "解析 Cron 表达式，展示可读描述和下次执行时间",
        },
        {
          href: "date-calculator.html",
          icon: "📅",
          name: "日期计算器",
          desc: "计算日期差异、日期推算、工作日统计",
        },
        {
          href: "meeting-scheduler.html",
          icon: "⏰",
          name: "跨时区会议时间协调器",
          desc: "跨时区会议时间协调器，在线使用，时间工具，浏览器本地运行无需上传",
        },
        {
          href: "pomodoro.html",
          icon: "🍅",
          name: "番茄钟计时器",
          desc: "番茄钟计时器，精准计时，时间工具，浏览器本地运行无需上传",
        },
        {
          href: "stopwatch.html",
          icon: "⏱️",
          name: "秒表计时器",
          desc: "在线秒表，支持计次、暂停、毫秒精度显示",
        },
        {
          href: "timestamp.html",
          icon: "⏱",
          name: "时间戳转换",
          desc: "时间戳与日期互转，支持多种格式和时区",
        },
        {
          href: "timezone-converter.html",
          icon: "🌍",
          name: "时区转换器",
          desc: "在不同时区之间转换时间",
        },
        {
          href: "work-hours.html",
          icon: "💼",
          name: "工时计算器",
          desc: "计算工作时长、加班时间和薪资估算",
        },
        {
          href: "world-clock.html",
          icon: "🌍",
          name: "世界时钟",
          desc: "世界时钟，在线使用，时间工具，浏览器本地运行无需上传",
        },
        {
          href: "countdown-timer.html",
          icon: "⏳",
          name: "倒计时定时器",
          desc: "可自定义的倒计时器，支持预设时间和提醒",
        },
        {
          href: "new-year-countdown.html",
          icon: "🎆",
          name: "新年倒计时",
          desc: "精致美观的新年倒计时页面，支持主题切换与分享链接",
        },
      ];
      const ROW_HEIGHT = 52;
      const vp = document.getElementById("cat-viewport");
      const spacer = document.getElementById("cat-spacer");
      const rowCache = new Map();

      const virtualizer = new VirtualCore.Virtualizer({
        count: CAT_TOOLS.length,
        getScrollElement: () => vp,
        estimateSize: () => ROW_HEIGHT,
        overscan: 8,
        observeElementRect: VirtualCore.observeElementRect,
        observeElementOffset: VirtualCore.observeElementOffset,
        scrollToFn: VirtualCore.elementScroll,
        getItemKey: (index) => index,
        onChange: () => renderRows(),
      });

      function createRow(tool) {
        const row = document.createElement("div");
        row.className = "cat-row";
        const link = document.createElement("a");
        link.className = "cat-row-link";
        link.href = tool.href;
        const icon = document.createElement("span");
        icon.className = "cat-icon-sm";
        icon.textContent = tool.icon;
        const name = document.createElement("span");
        name.className = "cat-row-name";
        name.textContent = tool.name;
        link.appendChild(icon);
        link.appendChild(name);
        const desc = document.createElement("span");
        desc.className = "cat-col cat-col-desc";
        desc.textContent = tool.desc;
        desc.title = tool.desc;
        row.appendChild(link);
        row.appendChild(desc);
        return row;
      }

      function renderRows() {
        const items = virtualizer.getVirtualItems();
        spacer.style.height = virtualizer.getTotalSize() + "px";
        const liveKeys = new Set(items.map((i) => i.key));
        for (const [key, row] of rowCache) {
          if (!liveKeys.has(key)) {
            row.remove();
            rowCache.delete(key);
          }
        }
        for (const item of items) {
          let row = rowCache.get(item.key);
          if (!row) {
            row = createRow(CAT_TOOLS[item.index]);
            rowCache.set(item.key, row);
          }
          if (!row.isConnected) {
            spacer.appendChild(row);
          }
          row.style.transform = "translateY(" + item.start + "px)";
        }
      }

      virtualizer._willUpdate();
      virtualizer.measure();
    </script>
